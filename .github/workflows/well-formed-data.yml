name: Well-formed data

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Run checker tests
        run: uv run python -m unittest discover -s code/tests -v

      - name: Check data well-formedness
        run: uv run daphne-check --root .
